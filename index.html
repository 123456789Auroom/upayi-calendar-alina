<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Календарь Упай • Алина</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f6f7f2}
    #calendar{display:block;width:100%;height:100dvh;border:0;background:#f6f7f2}
    #status{position:fixed;inset:0;display:grid;place-items:center;color:#19302d;font:600 14px/1.4 system-ui,sans-serif;background:#f6f7f2}
  </style>
</head>
<body>
  <div id="status">Загрузка календаря…</div>
  <iframe id="calendar" title="Персональный календарь Алины" src="index-alina-final.html"></iframe>
  <script>
    (() => {
      const frame = document.getElementById('calendar');
      const status = document.getElementById('status');
      const addScript = (doc, src) => new Promise((resolve, reject) => {
        const script = doc.createElement('script');
        script.src = src;
        script.onload = resolve;
        script.onerror = reject;
        doc.body.appendChild(script);
      });

      frame.addEventListener('load', async () => {
        try {
          const win = frame.contentWindow;
          const doc = frame.contentDocument;
          win.SVARA_CONFIG = {
            locationId: 'odessa-alina',
            locationName: 'Одесса',
            gridSelector: '#calendarGrid',
            tabArgument: 'svara'
          };

          const css = doc.createElement('link');
          css.rel = 'stylesheet';
          css.href = 'svara-calendar-integration.css';
          doc.head.appendChild(css);

          const tabs = doc.querySelector('.tabs-nav');
          if (tabs && !doc.querySelector('[data-svara-tab-button]')) {
            const button = doc.createElement('button');
            button.className = 'tab-btn';
            button.dataset.svaraTabButton = '';
            button.textContent = '🌬️ Свара-йога';
            button.addEventListener('click', () => {
              win.switchTab?.('svara', button);
              win.SvaraCalendarIntegration?.selectDate();
            });
            tabs.appendChild(button);
          }

          const modal = doc.getElementById('dayModal');
          if (modal && !doc.getElementById('tab-svara')) {
            const deepTab = doc.createElement('div');
            deepTab.id = 'tab-svara';
            deepTab.className = 'tab-content';
            deepTab.innerHTML = '<div id="svaraDeepContent" class="svara-empty">Загрузка расчёта Свара…</div>';
            modal.insertAdjacentElement('beforebegin', deepTab);
          }

          await addScript(doc, 'svara-data-odessa-alina.js');
          await addScript(doc, 'svara-calendar-integration.js');
          status.remove();
        } catch (error) {
          status.textContent = 'Не удалось загрузить слой Свара. Обновите страницу.';
          console.error('Svara bootstrap failed', error);
        }
      }, { once: true });
    })();
  </script>
</body>
</html>
